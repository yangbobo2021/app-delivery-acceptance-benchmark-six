<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Local Notes</title>
  <style>
    :root { font: 15px/1.5 system-ui, -apple-system, sans-serif; color: #24342e; background: #f5f7f5; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; }
    h1 { margin: 0 0 20px; font-size: 28px; line-height: 1.2; }
    .workspace { display: grid; grid-template-columns: minmax(190px, 240px) minmax(0, 1fr); gap: 20px; align-items: start; }
    .panel { min-width: 0; padding: 20px; border: 1px solid #dce6df; border-radius: 12px; background: #fff; box-shadow: 0 2px 10px #24342e0d; }
    .panel-heading { margin: 0 0 16px; font-size: 15px; font-weight: 700; color: #44564c; }
    #notes { display: grid; gap: 8px; }
    #notes button { width: 100%; text-align: left; overflow-wrap: anywhere; }
    label { display: grid; gap: 7px; margin: 0 0 16px; font-weight: 600; }
    input, textarea, button { font: inherit; }
    input, textarea { width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid #b9c9be; border-radius: 8px; color: inherit; background: #fff; }
    textarea { min-height: 190px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid #4c9164; outline-offset: 1px; }
    button { min-height: 38px; padding: 7px 12px; border: 1px solid #b9c9be; border-radius: 8px; color: inherit; background: #fff; cursor: pointer; }
    button:hover { background: #eef5ef; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    #save { border-color: #2f7e4d; color: #fff; background: #2f7e4d; }
    #save:hover { background: #24673d; }
    #error { min-height: 1.5em; margin: 14px 0 0; color: #a62f2f; }
    @media (max-width: 650px) { body { padding: 18px; } .workspace { grid-template-columns: 1fr; gap: 14px; } .panel { padding: 16px; } }
  </style>
</head>
<body>
  <h1>Notes</h1>
  <main class="workspace">
    <aside class="panel" aria-label="Saved notes">
      <h2 class="panel-heading">Your notes</h2>
      <div id="notes"></div>
    </aside>
    <section class="panel" aria-label="Note editor">
      <h2 class="panel-heading">Editor</h2>
      <label for="title">Title<input id="title" aria-label="Title"></label>
      <label for="body">Body<textarea id="body" aria-label="Body"></textarea></label>
      <div class="actions">
        <button id="new">New</button>
        <button id="save">Save</button>
        <button id="delete">Delete</button>
      </div>
      <p id="error" role="alert"></p>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
